services:
  postgres:
    image: postgres:16
    container_name: ndsa-postgres
    environment:
      POSTGRES_USER: ndsa
      POSTGRES_PASSWORD: ndsa_password
      POSTGRES_DB: ndsa_soc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ndsa-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
    command: start-dev
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
