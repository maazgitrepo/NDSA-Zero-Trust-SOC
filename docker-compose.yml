services:
  postgres:
    image: postgres:16
    container_name: ndsa-postgres
    environment:
      POSTGRES_USER: ndsa
      POSTGRES_PASSWORD: ndsa_password
      POSTGRES_DB: ndsa_soc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
